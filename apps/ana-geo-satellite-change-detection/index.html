<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#17181C" media="(prefers-color-scheme: dark)" />
<title>ANA geo-satellite-change-detection</title>
<link rel="stylesheet" href="/vendor/ana/tokens.css" />
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
<style>
  /* ── 골격: 글래스 헤더 / 메인 / 상태 바 / Converse — 토큰만 참조 ── */
  body { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  header.glass-header { height: var(--header-h); display: flex; align-items: center; gap: 10px; padding: 0 18px; }
  header h1 { font-size: 17px; font-weight: 800; letter-spacing: -0.03em; margin: 0; }
  .q { font-size: 12px; padding: 5px 11px; }

  main { flex: 1; display: flex; min-height: 0; background: var(--bg); }
  #panel { width: 300px; padding: 12px; overflow: auto; display: flex; flex-direction: column; gap: 10px; flex: none; }
  .card { padding: 14px; }
  #panel h2 { font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--text-weak); margin: 0 0 8px; }
  .card + .card { margin: 0; }

  /* form fields — label + control row, 44px+ 타깃 */
  .field { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .field label { width: 84px; flex: none; color: var(--text-sub); font-size: 13px; font-weight: 600; }
  .field input, .field select {
    flex: 1; min-width: 0; min-height: 36px; padding: 7px 10px; border-radius: var(--r-sm);
    border: 1.5px solid var(--line); background: var(--surface-2); color: var(--text);
    font: inherit; font-size: 13px; outline: none; transition: border-color .12s ease, background .12s ease;
  }
  .field input:focus, .field select:focus { border-color: var(--blue); background: var(--surface); }
  .field input[type="range"] { padding: 0; accent-color: var(--blue); min-height: 20px; }
  .field b { font-weight: 800; color: var(--blue); letter-spacing: -0.02em; font-size: 13px; flex: none; min-width: 34px; text-align: right; }
  .field .hint { flex: none; }

  /* 버튼: 알약 + 프레스 피드백, 터치 타깃 44px */
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 8px 16px; width: 100%;
         border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line);
         font-size: 13.5px; font-weight: 800; color: var(--text); cursor: pointer; margin-top: 8px;
         transition: transform .08s ease, background .12s ease; }
  .btn:hover { background: var(--blue-weak); border-color: var(--blue); color: var(--blue-700); }
  .btn:active { transform: scale(.96); }
  .btn[disabled] { opacity: .5; cursor: progress; }
  #searchbtn { background: var(--cool-bg); border-color: var(--cool-bg); color: var(--cool-fg); }
  #runbtn { background: var(--blue-weak); border-color: var(--blue-weak); color: var(--blue-700); }

  .hint { color: var(--text-weak); font-size: 12px; margin-top: 4px; }

  /* before/after slots */
  #slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .slot { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 9px; font-size: 12px; min-width: 0; background: var(--surface-2); }
  .slot .sid { font-size: 11.5px; overflow-wrap: anywhere; font-weight: 700; }
  .slot .role { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-weak); font-weight: 800; }
  .slot.filled.before { border-color: var(--c-4); }
  .slot.filled.after { border-color: var(--blue); }
  .slot .meta.hint { margin-top: 2px; }
  .slot button {
    margin-top: 6px; padding: 4px 10px; font-size: 11.5px; font-weight: 700; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text-sub);
    min-height: 26px; transition: transform .08s ease, background .12s ease;
  }
  .slot button:hover { border-color: var(--blue); color: var(--blue-700); background: var(--blue-weak); }
  .slot button:active { transform: scale(.94); }

  /* scene search results — scrolls inside itself so controls stay visible */
  #scenes { max-height: 220px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
  .scene { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; font-size: 12.5px; cursor: pointer; background: var(--surface-2); transition: border-color .12s ease; }
  .scene:hover { border-color: var(--blue); }
  .scene.before { border-color: var(--c-4); background: color-mix(in srgb, var(--c-4) 10%, var(--surface)); }
  .scene.after { border-color: var(--blue); background: var(--blue-weak); }
  .scene.disabled { opacity: .45; }
  .scene .sid { font-weight: 700; word-break: break-all; }
  .scene .meta { color: var(--text-weak); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
  .scene .pick { display: flex; gap: 6px; margin-top: 6px; }
  .scene .pick button {
    padding: 4px 10px; font-size: 11.5px; font-weight: 700; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text-sub); min-height: 26px;
    transition: transform .08s ease, background .12s ease;
  }
  .scene .pick button:hover:not([disabled]) { border-color: var(--blue); color: var(--blue-700); background: var(--blue-weak); }
  .scene .pick button:active:not([disabled]) { transform: scale(.94); }
  .scene .pick button[disabled] { opacity: .45; cursor: not-allowed; }

  /* result */
  #explain { margin: 6px 0; padding: 10px 12px; border-left: 3px solid var(--blue); background: var(--blue-weak); border-radius: var(--r-xs); font-size: 13px; font-weight: 600; color: var(--text); }
  table.kv { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.kv td { padding: 3px 0; vertical-align: top; word-break: break-word; }
  table.kv td:first-child { color: var(--text-weak); padding-right: 8px; white-space: nowrap; width: 96px; font-weight: 600; }
  table.kv td:last-child { font-weight: 800; color: var(--blue); letter-spacing: -0.02em; }

  .region-row { display: flex; align-items: center; gap: 8px; padding: 6px 2px; font-size: 13px; cursor: pointer; border-radius: var(--r-xs); min-height: 32px; transition: background .1s ease; }
  .region-row:hover { background: var(--surface-2); }
  .region-row .rank { color: var(--text-weak); width: 22px; font-variant-numeric: tabular-nums; font-weight: 700; }
  .region-row .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .region-row .area { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 800; color: var(--blue); letter-spacing: -0.02em; }

  /* layers */
  .layer-row { display: flex; align-items: center; gap: 8px; min-height: 32px; font-weight: 600; font-size: 13px; }
  .layer-row input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--blue); }
  .layer-row .count { margin-left: auto; font-weight: 800; color: var(--blue); font-size: 12.5px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

  #map { flex: 1; min-width: 0; }

  #statusbar { display: flex; gap: 8px; align-items: center; padding: 8px 14px; background: var(--bg); border-top: 1px solid var(--line-2); flex-wrap: wrap; }
  #statusbar .pill { background: var(--surface); box-shadow: var(--sh-card); padding: 6px 12px; font-size: 12.5px; color: var(--text-sub); font-weight: 600; }
  #statusbar b { color: var(--blue); font-weight: 800; letter-spacing: -0.03em; margin-left: 5px; }

  /* Converse */
  #converse { background: var(--surface); border-top: 1px solid var(--line-2); padding-bottom: var(--safe-b); }
  #feed { max-height: 168px; overflow: auto; padding: 10px 16px 4px; display: flex; flex-direction: column; gap: 6px; }
  .msg { padding: 8px 12px; border-radius: var(--r-sm); max-width: 72%; font-size: 13.5px; font-weight: 500; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--blue-weak); color: var(--blue-700); border-bottom-right-radius: 4px; }
  .msg.agent { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line-2); border-bottom-left-radius: 4px; }
  .msg.activity { align-self: flex-start; background: transparent; border: none; color: var(--text-weak);
                  font: 11px/1.5 ui-monospace, SFMono-Regular, monospace; padding: 0 12px; max-width: 92%; }
  #err { color: var(--warm-fg); padding: 0 16px; font-size: 12.5px; font-weight: 600; min-height: 1.1em; white-space: pre-wrap; }
  #err.warn { color: var(--text-sub); }
  #chatform { display: flex; gap: 8px; align-items: center; padding: 8px 14px 12px; }
  #chatinput { flex: 1; min-height: 46px; padding: 12px 16px; border-radius: 999px; border: 1.5px solid var(--line);
               background: var(--surface-2); color: var(--text); font-size: 14px; outline: none; }
  #chatinput:focus { border-color: var(--blue); background: var(--surface); }
  #send { width: 48px; height: 48px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 18px;
          font-weight: 800; box-shadow: var(--sh-fab); flex: none; transition: transform .08s ease; }
  #send:active { transform: scale(.9); }

  .leaflet-popup-content { font: 13px/1.45 -apple-system, system-ui, sans-serif; }

  @media (max-width: 1023px) {
    #panel { position: absolute; z-index: 20; height: 60%; width: min(320px, 86vw); }
    .msg { max-width: 86%; }
  }

  /* ── ANA 브랜드 헤더 / 우측 Converse 사이드바(조절 가능) / 칩 — 공통 오버라이드 ── */
  .logo { width: 28px; height: 28px; border-radius: 8px; }
  header.glass-header h1 { display: flex; align-items: baseline; gap: 7px; font-size: 17px; }
  .brand { font-weight: 800; letter-spacing: -0.03em; color: var(--text); }
  .appname { font-weight: 600; font-size: 15px; color: var(--text-sub); letter-spacing: -0.02em; }
  #resizer { width: 5px; flex: none; cursor: col-resize; background: transparent; transition: background .12s ease; touch-action: none; }
  #resizer:hover, #resizer.active { background: var(--blue-weak); }
  main > #converse { width: 320px; flex: none; display: flex; flex-direction: column; background: var(--surface);
    border-left: 1px solid var(--line-2); border-top: none; max-height: none; height: auto; }
  main > #converse #feed { flex: 1; max-height: none; height: auto; }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px; }
  #chips:not(:empty) { padding-bottom: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
    background: var(--cool-bg); color: var(--cool-fg); border-radius: 999px;
    padding: 4px 6px 4px 11px; font-size: 12px; font-weight: 700; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip button { width: 18px; height: 18px; min-height: 0; padding: 0; border-radius: 50%; border: none;
    background: color-mix(in srgb, var(--cool-fg) 16%, transparent); color: var(--cool-fg);
    font-size: 11px; line-height: 1; cursor: pointer; }
  @media (max-width: 1023px) {
    #resizer { display: none; }
    main { flex-direction: column; }
    main > #converse { width: 100% !important; height: 38dvh; border-left: none; border-top: 1px solid var(--line-2); }
  }
</style>
</head>
<body>
  <header class="glass-header">
    <img class="logo" src="/vendor/ana/ana-logo.png" alt="ANA 로고" />
    <h1><span class="brand">ANA</span><span class="appname">geo-satellite-change-detection</span></h1>
    <span class="pill badge-cool q">What changed over time?</span>
    <span class="pill badge-warm q" style="margin-left:auto">Sentinel-2 NDVI difference</span>
  </header>
  <main>
    <aside id="panel">
      <div class="card">
        <h2>Scene search (STAC)</h2>
        <div class="field"><label for="f-from">From</label><input id="f-from" type="date" /></div>
        <div class="field"><label for="f-to">To</label><input id="f-to" type="date" /></div>
        <div class="field"><label for="f-cloud">Max cloud %</label><input id="f-cloud" type="number" min="0" max="100" step="5" /></div>
        <button id="searchbtn" class="btn" aria-label="현재 화면 영역의 위성 장면 검색">Search scenes in view</button>
        <div class="hint" id="search-note"></div>
      </div>

      <div class="card">
        <h2>Before / after pair</h2>
        <div id="slots"></div>
        <div id="scenes"></div>
      </div>

      <div class="card">
        <h2>Analysis</h2>
        <div class="field">
          <label for="f-threshold">Threshold</label>
          <input id="f-threshold" type="range" /><b id="f-threshold-val">0.20</b>
        </div>
        <div class="field"><label for="f-direction">Change</label><select id="f-direction"></select></div>
        <div class="field"><label for="f-minarea">Min region</label><input id="f-minarea" type="number" min="0" step="1000" /><span class="hint">m²</span></div>
        <div class="field"><label for="f-limit">Show top</label><input id="f-limit" type="number" min="1" step="1" placeholder="all" /></div>
        <button id="runbtn" class="btn" aria-label="변화 탐지 분석 실행">Run change detection</button>
      </div>

      <div class="card">
        <h2>Result</h2>
        <div id="explain">No analysis yet.</div>
        <table class="kv" id="summary"></table>
        <div id="regions"></div>
      </div>

      <div class="card">
        <h2>Layers</h2>
        <div id="layers"></div>
      </div>
    </aside>
    <div id="map" role="application" aria-label="지도"></div>
    <div id="resizer" role="separator" aria-orientation="vertical" aria-label="채팅 사이드바 폭 조절"></div>
  <section id="converse" aria-label="ANA 대화">
    <div id="feed"></div>
    <div id="err" role="alert"></div>
    <div id="chips" aria-label="선택된 컨텍스트"></div>
    <form id="chatform">
      <input id="chatinput" placeholder='Talk to ANA — e.g. "Compare this image with the one from six months ago."' autocomplete="off" aria-label="ANA에게 메시지" />
      <button id="send" type="submit" aria-label="전송">↑</button>
    </form>
  </section>
  </main>
  <div id="statusbar">
    <span class="pill">Center<b id="s-center">–</b></span>
    <span class="pill">Zoom<b id="s-zoom">–</b></span>
    <span class="pill">Threshold<b id="s-threshold">–</b></span>
    <span class="pill">Changed area<b id="s-area">–</b></span>
    <span id="s-note"></span>
  </div>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/geo/stac.js"></script>
  <script src="/geo/change.js"></script>
  <script src="/app.js"></script>
</body>
</html>
