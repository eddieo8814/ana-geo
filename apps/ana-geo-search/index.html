<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ana-geo-search</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --text:#e2e8f0; --dim:#94a3b8; --accent:#38bdf8; --ok:#22c55e; --ref:#f59e0b; }
  * { box-sizing:border-box; margin:0; }
  body { font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; }
  header h1 { font-size:16px; } header .q { color:var(--dim); font-size:13px; }
  main { flex:1; display:flex; min-height:0; }
  #panel { width:330px; border-right:1px solid var(--line); padding:12px; overflow:auto; background:var(--panel); }
  #panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:14px 0 6px; }
  #panel h2:first-child { margin-top:0; }
  .layer-row { display:flex; align-items:center; gap:8px; padding:4px 0; }
  .layer-row .count { margin-left:auto; color:var(--dim); font-size:12px; }
  .layer-row .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  #map { flex:1; }
  #statusbar { padding:6px 16px; border-top:1px solid var(--line); display:flex; gap:20px; color:var(--dim); font-size:13px; flex-wrap:wrap; }
  #statusbar b { color:var(--text); font-weight:600; }
  #s-query { color:var(--accent); }
  #converse { border-top:1px solid var(--line); background:var(--panel); }
  #feed { max-height:150px; overflow:auto; padding:8px 16px; display:flex; flex-direction:column; gap:6px; }
  .msg { padding:6px 10px; border-radius:8px; max-width:70%; font-size:13px; }
  .msg.user { align-self:flex-end; background:#0ea5e91f; border:1px solid #0ea5e955; }
  .msg.agent { align-self:flex-start; background:#33415577; border:1px solid var(--line); }
  #chatform { display:flex; gap:8px; padding:8px 16px 12px; }
  #chatinput { flex:1; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  button { padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:#0ea5e922; border-color:var(--accent); }
  select, input[type="number"], input[type="text"] { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:4px 6px; font-size:13px; }
  #err { color:#f87171; padding:0 16px 6px; font-size:13px; min-height:1em; }
  #notice { color:var(--dim); font-size:12px; margin-top:6px; }
  input[type="file"] { display:none; }
  label.btn { padding:6px 10px; border:1px solid var(--line); border-radius:8px; cursor:pointer; display:inline-block; font-size:13px; }
  .cond { border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:8px; background:#0f172a66; }
  .cond .line { display:flex; gap:6px; align-items:center; margin-bottom:6px; }
  .cond .line:last-child { margin-bottom:0; }
  .cond select, .cond input { flex:1; min-width:0; }
  .cond .drop { flex:none; padding:2px 8px; }
  .row { display:flex; gap:6px; align-items:center; }
  .row > * { flex:1; }
  .row > .fixed { flex:none; }
  .hint { color:var(--dim); font-size:12px; margin-top:4px; }
  .explain { color:var(--dim); font-size:12px; margin-top:6px; }
  .explain div { padding:1px 0; }
</style>
</head>
<body>
  <header>
    <h1>ana-geo-search</h1>
    <span class="q">What satisfies these spatial conditions?</span>
  </header>
  <main>
    <aside id="panel">
      <h2>Features</h2>
      <div class="row">
        <select id="acq-category"></select>
        <button id="acq-btn" class="fixed">Acquire</button>
      </div>
      <div class="hint">Fetches the category from Overpass inside the current map view (FR-SEARCH-011).</div>
      <label class="btn" for="geofile" style="margin-top:8px">Load GeoJSON…</label>
      <input type="file" id="geofile" accept=".json,.geojson" />

      <h2>Query</h2>
      <div class="row">
        <span class="fixed" style="color:var(--dim)">Find</span>
        <select id="q-target"></select>
        <select id="q-operator" class="fixed">
          <option value="AND">AND</option>
          <option value="OR">OR</option>
        </select>
      </div>
      <div id="conditions" style="margin-top:8px"></div>
      <div class="row">
        <button id="add-cond">+ Condition</button>
        <button id="run" class="primary">Run search</button>
      </div>
      <div id="explain" class="explain"></div>

      <h2>Layers</h2>
      <div id="layers"></div>
      <div id="notice"></div>
    </aside>
    <div id="map"></div>
  </main>
  <div id="statusbar">
    <span>Center <b id="s-center">–</b></span>
    <span>Zoom <b id="s-zoom">–</b></span>
    <span>Results <b id="s-count">–</b></span>
    <span>Query <b id="s-query">–</b></span>
  </div>
  <section id="converse">
    <div id="feed"></div>
    <div id="err"></div>
    <form id="chatform">
      <input id="chatinput" placeholder='Talk to ANA — e.g. "Find cafes within 2 km of universities."' autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </section>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/vendor/turf/turf.min.js"></script>
  <script src="/geo/registry.js"></script>
  <script src="/geo/overpass.js"></script>
  <script src="/geo/spatial.js"></script>
  <script src="/geo/layers.js"></script>
  <script src="/app.js"></script>
</body>
</html>
