<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ana-geo-explorer</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --text:#e2e8f0; --dim:#94a3b8; --accent:#38bdf8; }
  * { box-sizing:border-box; margin:0; }
  body { font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; }
  header h1 { font-size:16px; } header .q { color:var(--dim); font-size:13px; }
  main { flex:1; display:flex; min-height:0; }
  #panel { width:280px; border-right:1px solid var(--line); padding:12px; overflow:auto; background:var(--panel); }
  #panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:14px 0 6px; }
  #panel h2:first-child { margin-top:0; }
  .cat-row, .layer-row { display:flex; align-items:center; gap:8px; padding:3px 0; }
  .cat-row .swatch { width:10px; height:10px; border-radius:50%; flex:none; }
  .cat-row label { flex:1; cursor:pointer; }
  .layer-row .count { margin-left:auto; color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  #findbtn { width:100%; margin-top:8px; background:#0ea5e91f; border-color:#0ea5e955; }
  #findbtn[disabled] { opacity:.55; cursor:progress; }
  #map { flex:1; }
  #detail { font-size:13px; color:var(--dim); }
  #detail .dt-name { color:var(--text); font-weight:600; font-size:14px; }
  #detail table { border-collapse:collapse; width:100%; margin-top:6px; }
  #detail td { padding:1px 0; vertical-align:top; word-break:break-all; }
  #detail td:first-child { color:var(--dim); padding-right:8px; white-space:nowrap; }
  #detail .tags { margin-top:6px; max-height:180px; overflow:auto; border-top:1px solid var(--line); padding-top:4px; }
  #statusbar { padding:6px 16px; border-top:1px solid var(--line); display:flex; gap:24px; color:var(--dim); font-size:13px; }
  #statusbar b { color:var(--text); font-weight:600; }
  #converse { border-top:1px solid var(--line); background:var(--panel); }
  #feed { max-height:160px; overflow:auto; padding:8px 16px; display:flex; flex-direction:column; gap:6px; }
  .msg { padding:6px 10px; border-radius:8px; max-width:70%; font-size:13px; }
  .msg.user { align-self:flex-end; background:#0ea5e91f; border:1px solid #0ea5e955; }
  .msg.agent { align-self:flex-start; background:#33415577; border:1px solid var(--line); }
  #chatform { display:flex; gap:8px; padding:8px 16px 12px; }
  #chatinput { flex:1; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  button { padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  #err { color:#f87171; padding:0 16px 6px; font-size:13px; min-height:1em; }
  #warn { color:#fbbf24; }
  .leaflet-popup-content { font:13px/1.45 system-ui,sans-serif; }
</style>
</head>
<body>
  <header>
    <h1>ana-geo-explorer</h1>
    <span class="q">What is there? — OpenStreetMap discovery over the ANA runtime</span>
  </header>
  <main>
    <aside id="panel">
      <h2>Categories</h2>
      <div id="cats"></div>
      <button id="findbtn">Find in view</button>
      <h2>Result layers</h2>
      <div id="layers"></div>
      <h2>Selection</h2>
      <div id="detail">Click a result to see its OSM detail.</div>
    </aside>
    <div id="map"></div>
  </main>
  <div id="statusbar">
    <span>Center <b id="s-center">–</b></span>
    <span>Zoom <b id="s-zoom">–</b></span>
    <span>Results <b id="s-count">0</b></span>
    <span id="s-note"></span>
  </div>
  <section id="converse">
    <div id="feed"></div>
    <div id="err"></div>
    <form id="chatform">
      <input id="chatinput" placeholder='Talk to ANA — e.g. "Find cafes around here."' autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </section>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/geo/registry.js"></script>
  <script src="/geo/overpass.js"></script>
  <script src="/app.js"></script>
</body>
</html>
