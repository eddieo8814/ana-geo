<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#17181C" media="(prefers-color-scheme: dark)" />
<title>ANA geo-route</title>
<link rel="stylesheet" href="/vendor/ana/tokens.css" />
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
<style>
  /* ── 골격: 글래스 헤더 / 메인 / 상태 바 / Converse — 토큰만 참조 ── */
  body { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  header.glass-header { height: var(--header-h); display: flex; align-items: center; gap: 10px; padding: 0 18px; }
  header h1 { font-size: 17px; font-weight: 800; letter-spacing: -0.03em; margin: 0; }
  .q { font-size: 12px; padding: 5px 11px; }
  #workerinfo { font-size: 11.5px; padding: 5px 11px; white-space: nowrap; }

  main { flex: 1; display: flex; min-height: 0; background: var(--bg); }
  #panel { width: 296px; padding: 12px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  .card { padding: 14px; }
  #panel h2 { font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--text-weak); margin: 0 0 10px; }

  /* 카드 안에서 JS가 다시 감싸는 결과 카드는 한 단계 낮은 톤으로 */
  .card .card { box-shadow: none; border: 1px solid var(--line-2); background: var(--surface-2); margin-top: 10px; padding: 10px; }
  .card.error { border: 1px solid var(--warm-fg); background: var(--warm-bg); }

  .row { display: flex; align-items: center; gap: 8px; padding: 5px 0; flex-wrap: wrap; }
  .row label { color: var(--text-sub); font-size: 13px; font-weight: 700; min-width: 76px; }
  .row .val { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 800; color: var(--blue);
              letter-spacing: -0.02em; font-size: 13.5px; }
  .note { color: var(--text-weak); font-size: 12px; margin-top: 6px; line-height: 1.5; }
  .hint { color: var(--text-weak); font-size: 12px; margin-top: 6px; line-height: 1.5; }
  .code { color: var(--warm-fg); font-weight: 800; font-size: 12px; letter-spacing: .03em;
          font-family: ui-monospace, SFMono-Regular, monospace; }

  ol.ranking { margin: 8px 0 0 18px; padding: 0; font-size: 13px; }
  ol.ranking li { padding: 3px 0; }
  /* 랭킹 행은 선택 컨텍스트 칩으로 등록되는 클릭 대상 (§24.1) */
  ol.ranking li[data-idx] { cursor: pointer; padding: 4px 7px; margin-left: -7px; border-radius: var(--r-xs);
                            transition: background .12s ease; }
  ol.ranking li[data-idx]:hover, ol.ranking li[data-idx]:focus-visible {
    background: var(--cool-bg); color: var(--cool-fg); outline: none; }
  .cost { color: var(--text-weak); font-weight: 600; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }

  .layer-row { display: flex; align-items: center; gap: 8px; min-height: 32px; font-weight: 600; }
  .layer-row input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--blue); }
  .layer-row .count { margin-left: auto; font-weight: 800; color: var(--blue); font-size: 13px; letter-spacing: -0.02em; }

  #map { flex: 1; min-width: 0; }

  /* 폼 컨트롤: 알약/라운드, 토큰만 사용 */
  select, input[type="text"], input[type="number"] {
    min-height: 36px; padding: 6px 12px; border-radius: var(--r-sm); border: 1.5px solid var(--line);
    background: var(--surface-2); color: var(--text); font-size: 13px; font-weight: 600; outline: none;
  }
  select:focus, input[type="text"]:focus, input[type="number"]:focus { border-color: var(--blue); background: var(--surface); }
  input[type="number"] { width: 84px; }

  /* 버튼: 알약 + 프레스 피드백, 터치 타깃 44px */
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 8px 14px;
         border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line);
         font-size: 13px; font-weight: 700; color: var(--text); cursor: pointer;
         transition: transform .08s ease, background .12s ease, border-color .12s ease; }
  .btn:hover:not(:disabled) { background: var(--blue-weak); border-color: var(--blue); color: var(--blue-700); }
  .btn:active:not(:disabled) { transform: scale(.96); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.active { background: var(--blue-weak); border-color: var(--blue); color: var(--blue-700); }
  .btn.wide { width: 100%; margin-top: 8px; }

  #lasterror:empty { display: none; }

  #statusbar { display: flex; gap: 8px; align-items: center; padding: 8px 14px; background: var(--bg); border-top: 1px solid var(--line-2); flex-wrap: wrap; }
  #statusbar .pill { background: var(--surface); box-shadow: var(--sh-card); padding: 6px 12px; font-size: 12.5px; color: var(--text-sub); font-weight: 600; }
  #statusbar b { color: var(--blue); font-weight: 800; letter-spacing: -0.03em; margin-left: 5px; }
  #s-busy { font-size: 12.5px; font-weight: 700; color: var(--text-weak); }
  #s-busy.busy { color: var(--blue); }

  /* Converse */
  #converse { background: var(--surface); border-top: 1px solid var(--line-2); padding-bottom: var(--safe-b); }
  #feed { max-height: 168px; overflow: auto; padding: 10px 16px 4px; display: flex; flex-direction: column; gap: 6px; }
  .msg { padding: 8px 12px; border-radius: var(--r-sm); max-width: 72%; font-size: 13.5px; font-weight: 500; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--blue-weak); color: var(--blue-700); border-bottom-right-radius: 4px; }
  .msg.agent { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line-2); border-bottom-left-radius: 4px; }
  .msg.activity { align-self: flex-start; background: transparent; border: none; color: var(--text-weak);
                  font: 11px/1.5 ui-monospace, SFMono-Regular, monospace; padding: 0 12px; max-width: 92%; }
  #err { color: var(--warm-fg); padding: 0 16px; font-size: 12.5px; font-weight: 600; min-height: 1.1em; }
  #chatform { display: flex; gap: 8px; align-items: center; padding: 8px 14px 12px; }
  #chatinput { flex: 1; min-height: 46px; padding: 12px 16px; border-radius: 999px; border: 1.5px solid var(--line);
               background: var(--surface-2); color: var(--text); font-size: 14px; outline: none; }
  #chatinput:focus { border-color: var(--blue); background: var(--surface); }
  #send { width: 48px; height: 48px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 18px;
          font-weight: 800; box-shadow: var(--sh-fab); flex: none; transition: transform .08s ease; }
  #send:active { transform: scale(.9); }

  @media (max-width: 1023px) {
    #panel { position: absolute; z-index: 20; height: 60%; width: min(300px, 84vw); }
    .msg { max-width: 86%; }
  }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--text); box-shadow: var(--sh-card); }
  .leaflet-popup-content-wrapper { border-radius: var(--r-sm); }
  .leaflet-popup-content { font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text); margin: 10px 14px; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--text-weak); }

  /* ── ANA 브랜드 헤더 / 우측 Converse 사이드바(조절 가능) / 칩 — 공통 오버라이드 ── */
  .logo { width: 28px; height: 28px; border-radius: 8px; }
  header.glass-header h1 { display: flex; align-items: baseline; gap: 7px; font-size: 17px; }
  .brand { font-weight: 800; letter-spacing: -0.03em; color: var(--text); }
  .appname { font-weight: 600; font-size: 15px; color: var(--text-sub); letter-spacing: -0.02em; }
  #resizer { width: 5px; flex: none; cursor: col-resize; background: transparent; transition: background .12s ease; touch-action: none; }
  #resizer:hover, #resizer.active { background: var(--blue-weak); }
  main > #converse { width: 320px; flex: none; display: flex; flex-direction: column; background: var(--surface);
    border-left: 1px solid var(--line-2); border-top: none; max-height: none; height: auto; }
  main > #converse #feed { flex: 1; max-height: none; height: auto; }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px; }
  #chips:not(:empty) { padding-bottom: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
    background: var(--cool-bg); color: var(--cool-fg); border-radius: 999px;
    padding: 4px 6px 4px 11px; font-size: 12px; font-weight: 700; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip button { width: 18px; height: 18px; min-height: 0; padding: 0; border-radius: 50%; border: none;
    background: color-mix(in srgb, var(--cool-fg) 16%, transparent); color: var(--cool-fg);
    font-size: 11px; line-height: 1; cursor: pointer; }
  @media (max-width: 1023px) {
    #resizer { display: none; }
    main { flex-direction: column; }
    main > #converse { width: 100% !important; height: 38dvh; border-left: none; border-top: 1px solid var(--line-2); }
  }
</style>
</head>
<body>
  <header class="glass-header">
    <img class="logo" src="/vendor/ana/ana-logo.png" alt="ANA 로고" />
    <h1><span class="brand">ANA</span><span class="appname">geo-route</span></h1>
    <span class="pill badge-cool q">How are places connected?</span>
    <span class="pill badge-warm q" id="workerinfo" style="margin-left:auto">worker: checking…</span>
  </header>
  <main>
    <aside id="panel">
      <div class="card">
        <h2>Route</h2>
        <div class="row">
          <label>Map click</label>
          <button id="pick-origin" class="btn active" aria-label="지도 클릭 시 출발지 지정">Origin</button>
          <button id="pick-dest" class="btn" aria-label="지도 클릭 시 목적지 지정">Destination</button>
        </div>
        <div class="row"><label>Origin</label><span class="val" id="v-origin">–</span></div>
        <div class="row"><label>Destination</label><span class="val" id="v-dest">–</span></div>
        <div class="row">
          <label>Mode</label>
          <select id="mode" aria-label="이동 수단">
            <option value="drive">Driving</option>
            <option value="walk">Walking</option>
            <option value="bike">Cycling</option>
          </select>
        </div>
        <div class="row">
          <label>Optimize</label>
          <select id="optimize" aria-label="최적화 기준">
            <option value="time">Fastest (time)</option>
            <option value="distance">Shortest (distance)</option>
          </select>
        </div>
        <button id="go-route" class="btn wide" aria-label="경로 찾기">Find route</button>
        <button id="clear-points" class="btn wide" aria-label="출발지·목적지 초기화">Clear origin &amp; destination</button>
        <div id="route-summary"></div>
      </div>

      <div class="card">
        <h2>Nearest destination</h2>
        <div class="row">
          <label>Category</label>
          <select id="category" aria-label="목적지 카테고리"></select>
        </div>
        <div class="row">
          <label>Radius km</label>
          <input type="number" id="radius" min="0.2" max="10" step="0.5" aria-label="검색 반경 km" />
          <span class="val" id="v-candidates">0 loaded</span>
        </div>
        <button id="go-candidates" class="btn wide" aria-label="OSM에서 후보지 가져오기">Fetch candidates from OSM</button>
        <button id="go-nearest" class="btn wide" aria-label="네트워크 비용 기준 정렬">Rank by network cost</button>
        <div id="ranking"></div>
      </div>

      <div class="card">
        <h2>Isochrone</h2>
        <div class="row">
          <label>Minutes</label>
          <input type="text" id="minutes" aria-label="등시선 분 목록, 쉼표로 구분" />
        </div>
        <button id="go-isochrone" class="btn wide" aria-label="도달 가능 영역 표시">Show reachable area</button>
        <div id="isochrone-summary"></div>
      </div>

      <div class="card">
        <h2>Network</h2>
        <div id="network"></div>
      </div>

      <div class="card">
        <h2>Layers</h2>
        <div id="layers"></div>
      </div>

      <div class="card">
        <h2>Analysis bounds</h2>
        <div class="row">
          <label>Area cap km²</label>
          <input type="number" id="areacap" min="1" step="10" aria-label="분석 면적 상한 km²" />
        </div>
        <div class="note">Requests whose padded bbox exceeds the cap are refused with the numbers, never truncated (FR-ROUTE-010).</div>
      </div>

      <div id="lasterror"></div>
    </aside>
    <div id="map" role="application" aria-label="지도"></div>
    <div id="resizer" role="separator" aria-orientation="vertical" aria-label="채팅 사이드바 폭 조절"></div>
  <section id="converse" aria-label="ANA 대화">
    <div id="feed"></div>
    <div id="err" role="alert"></div>
    <div id="chips" aria-label="선택된 컨텍스트"></div>
    <form id="chatform">
      <input id="chatinput" placeholder='Talk to ANA — e.g. "Which hospital can I reach fastest?"' autocomplete="off" aria-label="ANA에게 메시지" />
      <button id="send" type="submit" aria-label="전송">↑</button>
    </form>
  </section>
  </main>
  <div id="statusbar">
    <span class="pill">Center<b id="s-center">–</b></span>
    <span class="pill">Zoom<b id="s-zoom">–</b></span>
    <span class="pill">Route<b id="s-route">–</b></span>
    <span id="s-busy"></span>
  </div>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/geo/registry.js"></script>
  <script src="/geo/overpass.js"></script>
  <script src="/geo/styles.js"></script>
  <script src="/app.js"></script>
</body>
</html>
